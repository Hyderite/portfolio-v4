name: Build Docker image and Deploy

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.1.3'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert cache string to lowercase
        run: |
          MY_STR="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          LOWER_STR=$(echo "$MY_STR" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF_LOWER=$LOWER_STR" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_REF_LOWER }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REF_LOWER }}:buildcache,mode=max

      - name: Back up image and deploy
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          GITHUB_ACTOR: ${{ github.actor }}
          TEMPS_API_KEY: ${{ secrets.TEMPS_API_KEY }} # Make sure to add your Temps API key
          TEMPS_API_URL: https://console.hyderite.dev # Change this to the url of your Temps instance
          PROJECT_NAME: portfolio-v4 # Change this to your project name
        run: |
          set -euo pipefail

          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST} &
          sign_pid=$!

          deploy_status=0
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TARGET_IMAGE=$(echo "${TAGS}" | head -n 1)
            echo "Triggering Temps deployment..."

            npx --yes @temps-sdk/cli login --api-key "${TEMPS_API_KEY}" "${TEMPS_API_URL}"
            npx --yes @temps-sdk/cli deploy:image \
              --project "${PROJECT_NAME}" \
              --environment "production" \
              --image "${TARGET_IMAGE}" \
              --timeout 300 || deploy_status=$?
          fi

          sign_status=0
          wait "$sign_pid" || sign_status=$?
          if [ "$deploy_status" -ne 0 ] || [ "$sign_status" -ne 0 ]; then
            echo "Pipeline failed. Deploy status: $deploy_status, Sign status: $sign_status"
            exit 1
          fi
